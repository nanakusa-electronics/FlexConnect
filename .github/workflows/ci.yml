name: CI

on:
  pull_request:
  push:
    branches: [master, "codex/**"]
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.2"
  GOWORK: "off"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS amd64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Race-sensitive packages
        run: go test -race ./internal/appd ./internal/apiserver ./internal/socks5 ./internal/osnet ./internal/vpn/anyconnect ./internal/vpn/atrust ./internal/vpn/multi ./internal/tunio ./internal/anyconnect/tunnel ./client/local ./client/systray
      - name: Linux network namespace route ownership
        if: matrix.name == 'Linux'
        run: sudo env "PATH=$PATH" FLEXCONNECT_NETNS_TEST=1 go test ./internal/osnet -run '^TestNetworkNamespaceRouteOwnershipTransaction$' -count=1
      - name: Linux native TUN packet I/O
        if: matrix.name == 'Linux'
        run: |
          go test -c -o /tmp/flexconnect-tun.test ./internal/anyconnect/tunnel
          sudo unshare --net env FLEXCONNECT_TUN_TEST=1 /tmp/flexconnect-tun.test -test.run '^TestNativeLinuxTUNPacketIO$' -test.timeout=15s
      - name: Native aTrust TUN TCP and UDP flows
        run: python scripts/test-native-atrust.py
      - name: Windows named-pipe actor integration
        if: matrix.name == 'Windows'
        run: go test ./internal/ipc -run '^TestNamedPipeCapturesClientIdentity$' -count=1
      - name: DNS and scutil contracts
        run: go test ./internal/osnet -run '^(TestDNSBackendSelection|TestDarwinDNS)' -count=1

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.2" }
      - run: go run ./cmd/dist build --version 2.0.0 linux/amd64/tgz linux/amd64/deb linux/amd64/rpm
      - run: docker build --build-arg VERSION=2.0.0 -t flexconnect:ci .

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.2" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: go run ./cmd/dist build --version 2.0.0 windows/amd64/zip windows/amd64/msi

  package-macos:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.2" }
      - run: go run ./cmd/dist build --version 2.0.0 darwin/${{ matrix.arch }}/pkg
