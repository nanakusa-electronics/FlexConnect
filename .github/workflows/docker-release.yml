name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image-tag:
        description: "用于手工发布的镜像标签（可选）"
        required: false
        default: ""
      source-ref:
        description: "用于手工重发的源码 ref（可选）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  GOWORK: "off"

jobs:
  validate:
    name: Validate release source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source-ref || github.ref }}
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.2" }
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./internal/appd ./internal/apiserver ./internal/socks5 ./internal/osnet ./internal/vpn/anyconnect ./internal/vpn/atrust ./internal/vpn/multi ./internal/tunflow ./internal/tunio ./client/local ./client/systray
      - name: Linux network namespace route ownership
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" FLEXCONNECT_NETNS_TEST=1 go test ./internal/osnet -run '^TestNetworkNamespaceRouteOwnershipTransaction$' -count=1
      - name: Native aTrust TUN TCP and UDP flows
        run: python scripts/test-native-atrust.py
      - name: Windows named-pipe actor integration
        if: runner.os == 'Windows'
        run: go test ./internal/ipc -run '^TestNamedPipeCapturesClientIdentity$' -count=1
      - name: DNS and scutil contracts
        run: go test ./internal/osnet -run '^(TestDNSBackendSelection|TestDarwinDNS)' -count=1

  publish:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source-ref || github.ref }}

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}},event=tag
            type=semver,pattern={{major}},event=tag,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}}.{{minor}},event=tag,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.image-tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image-tag != '' }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.image-tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image-tag != '' && !contains(github.event.inputs.image-tag, '-') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.image-tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image-tag != '' && !contains(github.event.inputs.image-tag, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image-tag != '' && !contains(github.event.inputs.image-tag, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image-tag == '' }}

      - name: Derive binary version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.image-tag }}" ]]; then
            version="${{ github.event.inputs.image-tag }}"
          else
            version="dev-${GITHUB_SHA::12}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "invalid binary version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
